name: Build Arabic release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build unsigned release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/ShizuTools-1.4.6-ar3-unsigned.apk"
          zip -r "dist/ShizuTools-1.4.6-ar3-source.zip" . -x "./.git/*" "./dist/*" "./app/build/*" "./.gradle/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.6-ar3
          name: ShizuTools Arabic v1.4.6-ar3
          body: |
            Arabic localized, accessibility-friendly custom build of ShizuTools (upstream v1.4.6, github.com/legendsayantan/ShizuTools, GPLv3).
            - Full Arabic translation (values-ar) including all previously hardcoded strings.
            - TalkBack labels added to icon-only buttons; decorative icons hidden from screen readers.
            - GitHub/developer link button and upstream update checker removed.
            - Unsigned release APK: sign it yourself before installing.
            - ar3: reverts the ar2 auto-hide default change (back to upstream behavior) per user decision - turn off the "Hide after Timeout" switch once in SoundMaster settings.
          files: dist/*
